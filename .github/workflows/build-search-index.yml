name: Build Hindu Search Index
on:
  push:
    paths: ['data/**','scripts/build-content-index.py']
  workflow_dispatch:
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build-content-index.py
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/search-index.json
          git diff --cached --quiet || git commit -m 'build: update Hindu search index'
          git push
