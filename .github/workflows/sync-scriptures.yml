name: Sync Hindu Scriptures
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync source corpora
        run: python scripts/sync-scriptures.py
      - name: Validate JSON
        run: python - <<'PY'
import json, pathlib
for p in pathlib.Path('data').rglob('*.json'):
    json.loads(p.read_text(encoding='utf-8'))
print('JSON validation passed')
PY
      - name: Commit corpus updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'chore: sync scripture corpus'
          git push
