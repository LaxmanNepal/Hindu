name: Update Hindu Knowledge

on:
  schedule:
    - cron: '17 1 * * *'
      timezone: 'Asia/Kathmandu'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hindu-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Import open scripture datasets
        run: python scripts/import_open_texts.py

      - name: Fetch and normalize public sources
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python scripts/update_content.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/content.json > /dev/null
          python -m json.tool data/scriptures.json > /dev/null
          python -m json.tool data/texts/bhagavad-gita.json > /dev/null

      - name: Commit updated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/content.json data/scriptures.json data/texts
          if git diff --cached --quiet; then
            echo 'No content changes.'
            exit 0
          fi
          git commit -m 'chore: update Hindu scriptures and knowledge sources'
          git push
