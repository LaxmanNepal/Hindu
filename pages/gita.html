<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="भगवद्गीता — १८ अध्याय, ७०० श्लोक, संस्कृत पाठ र नेपाली भावार्थ"><title>भगवद्गीता — हिन्दू</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><div class="deity-hero"><span class="eyebrow">🪷 कृष्ण · अर्जुन · कुरुक्षेत्र</span><h1>भगवद्गीता</h1><p>महाभारतको भीष्म पर्वमा रहेको कृष्ण–अर्जुन संवाद। परम्परागत रूपमा १८ अध्याय र ७०० श्लोक।</p><div class="deity-search"><span>⌕</span><input id="q" placeholder="अध्याय वा श्लोक खोज्नुहोस्…"></div></div><div class="story-grid" id="chapters"></div><div class="section"><div class="quote-card"><p>कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।</p><footer>२.४७ · कर्मयोगको प्रसिद्ध शिक्षा</footer></div></div></main><script src="../assets/js/nav.js"></script><script>fetch('../data/scriptures.json').then(r=>r.json()).then(d=>{const box=document.querySelector('#chapters'),q=document.querySelector('#q');const render=()=>{const t=q.value.toLocaleLowerCase('ne');box.innerHTML=d.gita.chapters.filter(c=>JSON.stringify(c).toLocaleLowerCase('ne').includes(t)).map(c=>`<article class="story-card"><small>अध्याय ${c[0]} · ${c[2]} श्लोक</small><h3>${c[1]}</h3><p>${c[3]}</p><a class="text-link" href="https://vedicscriptures.github.io/chapter/${c[0]}" target="_blank" rel="noopener">मूल अध्याय डेटा →</a></article>`).join('')};q.addEventListener('input',render);render()})</script></body></html>
