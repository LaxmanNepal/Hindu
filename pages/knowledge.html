<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="हिन्दू धर्मको ज्ञानकोश — वेद, गीता, भगवान्, मन्त्र, कथा, शास्त्र र दर्शन"><title>हिन्दू ज्ञानकोश</title><link rel="stylesheet" href="../assets/css/style.css"><style>.knowledge-page{max-width:1100px;margin:auto;padding:24px 18px}.knowledge-page h1{font-size:clamp(30px,7vw,50px);margin:0}.knowledge-search{margin:18px 0;display:flex;background:#fff;border:1px solid #ead8ca;border-radius:16px;padding:0 14px;height:56px;align-items:center}.knowledge-search input{border:0;outline:0;width:100%;font:inherit}.knowledge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k-card{background:#fff;border:1px solid #eaded4;border-radius:20px;padding:18px}.k-card b{color:#a44a1b;font-size:11px}.k-card h2{margin:7px 0;font-size:19px}.k-card p{font-size:12px;line-height:1.8;color:#806d62}.k-card a{color:#a44a1b;font-size:11px;font-weight:800}@media(min-width:760px){.knowledge-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:480px){.knowledge-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="om">ॐ</span><span>हिन्दू</span></a></header><nav class="knowledge-nav" data-site-nav></nav><main class="knowledge-page"><p class="eyebrow">सनातन ज्ञान</p><h1>हिन्दू ज्ञानकोश</h1><div class="knowledge-search">⌕ <input id="q" placeholder="धर्म, कर्म, वेद, योग, दर्शन, कथा खोज्नुहोस्…"></div><div class="knowledge-grid" id="grid"></div></main><script src="../assets/js/site.js"></script><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];fetch('../data/hindu-encyclopedia.json').then(r=>r.json()).then(d=>{all=[...(d.majorTexts||[]).map(x=>({...x,category:'ग्रन्थ'})),...(d.stories||[]).map(x=>({...x,category:'कथा'})),...(d.concepts||[]).map(x=>({...x,category:'अवधारणा',description:x.meaning}))];render(all)}).catch(()=>grid.innerHTML='<div class="empty">ज्ञान सामग्री उपलब्ध छैन।</div>');function render(xs){grid.innerHTML=xs.map(x=>`<article class="k-card"><b>${esc(x.category||'ज्ञान')}</b><h2>${esc(x.title||x.name||x.term)}</h2><p>${esc(x.description||x.summary||x.focus||'')}</p>${x.structure?`<p>${esc(x.structure)}</p>`:''}</article>`).join('')||'<div class="empty">कुनै परिणाम भेटिएन।</div>'}q.oninput=()=>{const s=q.value.trim().toLowerCase();render(all.filter(x=>JSON.stringify(x).toLowerCase().includes(s)))}</script></body></html>
