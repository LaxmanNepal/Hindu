<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>हिन्दू ज्ञानकोश</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><a class="brand" href="../">ॐ <span>हिन्दू</span></a></header><main class="section"><span class="eyebrow">सनातन ज्ञान</span><h1>हिन्दू ज्ञानकोश</h1><p class="hero-copy">ग्रन्थ, कथा, दर्शन र प्रमुख अवधारणालाई एउटै ठाउँमा खोज्नुहोस्।</p><input id="q" class="search-input" placeholder="ज्ञान, कथा, वेद वा अवधारणा खोज्नुहोस्…"><div id="results" class="story-grid"></div></main><script>fetch('../data/hindu-encyclopedia.json').then(r=>r.json()).then(d=>{const all=[...d.majorTexts.map(x=>({...x,kind:'ग्रन्थ'})),...d.stories.map(x=>({...x,kind:'कथा'})),...d.concepts.map(x=>({...x,kind:'अवधारणा',summary:x.meaning}))];const render=q=>{q=q.toLowerCase();const a=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,80);document.querySelector('#results').innerHTML=a.map(x=>`<article class="story-card"><span class="eyebrow">${x.kind}</span><h3>${x.name||x.title||x.term}</h3><p>${x.summary||x.focus||x.meaning||''}</p>${x.structure?`<small>${x.structure}</small>`:''}${x.themes?`<small>विषय: ${x.themes.join(' · ')}</small>`:''}</article>`).join('')||'<p>कुनै सामग्री भेटिएन।</p>'};render('');document.querySelector('#q').oninput=e=>render(e.target.value)})</script><script src="../assets/js/nav.js"></script></body></html>
