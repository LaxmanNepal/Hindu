<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मन्त्र संग्रह — हिन्दू</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><a class="brand" href="../">ॐ <span>हिन्दू</span></a><a class="text-link" href="../">गृह</a></header><main class="section"><span class="eyebrow">जप र साधना</span><h1>मन्त्र संग्रह</h1><p class="hero-copy">मन्त्रसँगै उच्चारण, अर्थ र स्रोत जोडिने संरचना।</p><div class="mantra-list" id="list"></div></main><script>fetch('../data/content.json').then(r=>r.json()).then(d=>document.querySelector('#list').innerHTML=d.mantras.map(x=>`<article class="mantra"><strong>${x.name}</strong><span>${x.text}</span></article>`).join(''))</script></body></html>
