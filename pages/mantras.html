<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मन्त्र संग्रह — हिन्दू</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><span class="eyebrow">जप र साधना</span><h1>मन्त्र संग्रह</h1><p class="hero-copy">मन्त्रसँगै उच्चारण, अर्थ र स्रोत जोडिने संरचना।</p><div class="deity-search"><span>⌕</span><input id="q" placeholder="मन्त्र खोज्नुहोस्…"></div><div class="mantra-list" id="list"></div></main><script src="../assets/js/nav.js"></script><script>fetch('../data/content.json').then(r=>r.json()).then(d=>{const list=d.mantras||[],box=document.querySelector('#list'),q=document.querySelector('#q');const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const render=()=>{const t=q.value.toLocaleLowerCase('ne');box.innerHTML=list.filter(x=>JSON.stringify(x).toLocaleLowerCase('ne').includes(t)).map(x=>`<article class="mantra"><strong>${esc(x.name)}</strong><span>${esc(x.text)}</span>${x.meaning?`<small>${esc(x.meaning)}</small>`:''}</article>`).join('')};q.addEventListener('input',render);render()})</script></body></html>
