<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>कथा संग्रह — हिन्दू</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><span class="eyebrow">इतिहास र पुराण</span><h1>कथा संग्रह</h1><p class="hero-copy">महाभारत, रामायण, पुराण, देवी–देवता र भक्तिपरम्परासँग सम्बन्धित कथाहरू।</p><div class="deity-search"><span>⌕</span><input id="q" placeholder="कथा, पात्र वा विषय खोज्नुहोस्…"></div><div class="story-grid" id="list"></div></main><script src="../assets/js/nav.js"></script><script>Promise.all([fetch('../data/content.json').then(r=>r.json()),fetch('../data/hindu-knowledge.json').then(r=>r.json())]).then(([d,k])=>{const rows=[...(d.stories||[]),...(k.major_stories||[])],box=document.querySelector('#list'),q=document.querySelector('#q');const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const render=()=>{const t=q.value.toLocaleLowerCase('ne');box.innerHTML=rows.filter(x=>JSON.stringify(x).toLocaleLowerCase('ne').includes(t)).map(x=>`<article class="story-card"><b>${esc(x.icon||'🪔')}</b><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p>${x.themes?`<small>${x.themes.map(esc).join(' · ')}</small>`:''}</article>`).join('')};q.addEventListener('input',render);render()})</script></body></html>
