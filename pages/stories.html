<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>कथा संग्रह — हिन्दू</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><a class="brand" href="../">ॐ <span>हिन्दू</span></a><a class="text-link" href="../">गृह</a></header><main class="section"><span class="eyebrow">इतिहास र पुराण</span><h1>कथा संग्रह</h1><p class="hero-copy">महाभारत, रामायण, पुराण र देवी-देवतासँग सम्बन्धित कथाहरू।</p><div class="story-grid" id="list"></div></main><script>fetch('../data/content.json').then(r=>r.json()).then(d=>document.querySelector('#list').innerHTML=d.stories.map(x=>`<article class="story-card"><b>${x.icon}</b><h3>${x.title}</h3><p>${x.summary}</p></article>`).join(''))</script></body></html>
