<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="चार वेदको नेपाली ज्ञानकोश — ऋग्वेद, यजुर्वेद, सामवेद र अथर्ववेद।"><title>वेद ज्ञानकोश — हिन्दू</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section deity-page"><div class="deity-hero"><span class="eyebrow">📜 श्रुति · वैदिक ज्ञान</span><h1>चार वेद</h1><p>ऋग्वेद, यजुर्वेद, सामवेद र अथर्ववेदको संरचना, विषय, प्रमुख देवता, सूक्त र सम्बन्धित वेदाङ्गको नेपाली परिचय।</p><div class="deity-search"><span>⌕</span><input id="q" placeholder="वेद, मण्डल, काण्ड, सूक्त वा विषय खोज्नुहोस्…"></div></div><section class="story-grid" id="list"></section><section class="section"><article class="quote-card"><p>वेदलाई हिन्दू परम्परामा श्रुति अर्थात् ‘सुनेर प्राप्त भएको’ पवित्र ज्ञानको मूल संग्रह मानिन्छ।</p><footer>वेदसम्बन्धी परम्परागत र शैक्षिक परिचय</footer></article></section></main><script src="../assets/js/nav.js"></script><script>fetch('../data/scriptures.json').then(r=>r.json()).then(d=>{const list=d.veda||d.vedas||[];const box=document.querySelector('#list'),q=document.querySelector('#q');const fallback=[['ऋग्वेद','१० मण्डल','देवता, प्रकृति, यज्ञ र स्तोत्रसम्बन्धी ऋचाहरू।'],['यजुर्वेद','शुक्ल/कृष्ण परम्परा','यज्ञीय कर्म र अनुष्ठानका मन्त्र तथा गद्य।'],['सामवेद','सामगान','गायनका लागि विन्यस्त वैदिक मन्त्र।'],['अथर्ववेद','२० काण्ड','गृहजीवन, प्रार्थना, उपचार, अनुष्ठान र दार्शनिक सामग्री।']];const rows=list.length?list.map(x=>[x.name||x[0],x.structure||x[1]||'',x.description||x[2]||'']):fallback;const render=()=>{const t=q.value.toLocaleLowerCase('ne');box.innerHTML=rows.filter(x=>x.join(' ').toLocaleLowerCase('ne').includes(t)).map(x=>`<article class="story-card"><b>📜</b><h3>${x[0]}</h3><p><strong>${x[1]}</strong><br>${x[2]}</p></article>`).join('')};q.addEventListener('input',render);render()}).catch(()=>{});</script></body></html>
